name: CI

# Compiles and tests every push and pull request on Windows and Linux, so the Linux-only code
# (`burner/unix.rs`, SG_IO, `self_update.rs`) is built on each commit. ffmpeg/ffprobe are not
# installed: tests that need external tools skip themselves (see CLAUDE.md).
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name in a workflow_call, so a call from release.yml never shares a group with the push run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev libxdo-dev patchelf

      # package.json lives in the repo root; the sources are in ./frontend.
      - run: npm ci
      - run: npm run build
      - run: npm test

      - run: cargo check --workspace --tests
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --lib
