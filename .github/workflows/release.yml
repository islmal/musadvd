name: Release

# Push a tag like v0.1.0 (or run manually) to build the NSIS installer and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # ffmpeg/ffprobe are git-ignored (~220 MB each); fetch the same build as local dev.
      - name: Fetch ffmpeg 9.0.1 full build
        shell: pwsh
        run: |
          curl.exe -L --fail -o ffmpeg.7z https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.1-full_build.7z
          7z x ffmpeg.7z -offmpeg-extract
          Copy-Item ffmpeg-extract\*\bin\ffmpeg.exe bin\
          Copy-Item ffmpeg-extract\*\bin\ffprobe.exe bin\

      - run: npm ci
      - run: npm run tauri build

      - uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*.exe
          generate_release_notes: true
