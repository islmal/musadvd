name: Release

# Builds Windows (NSIS .exe + portable .zip) and Linux (.deb, .AppImage, portable .tar.gz)
# on every push to main/master (rolling `nightly` pre-release) and on `v*` tags (versioned release + latest.json).
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  windows:
    needs: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # ffmpeg/ffprobe are git-ignored (~220 MB each); gyan.dev keeps the latest release under a stable URL.
      - name: Fetch ffmpeg full build
        shell: pwsh
        run: |
          # gyan.dev answers 503 now and then (v1.2.0 release failed on it): retry for a few minutes.
          curl.exe -L --fail --retry 8 --retry-delay 30 --retry-all-errors -o ffmpeg.7z https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z
          if ($LASTEXITCODE) { exit 1 }
          7z x ffmpeg.7z -offmpeg-extract
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item ffmpeg-extract\*\bin\ffmpeg.exe bin\
          Copy-Item ffmpeg-extract\*\bin\ffprobe.exe bin\

      - run: npm ci

      - name: Build CLI binary
        run: cargo build --release --bin musadvd

      - name: Configure Windows installer to bundle CLI binary
        shell: pwsh
        run: |
          '{"bundle":{"resources":{"../target/release/musadvd.exe":"musadvd.exe"}}}' | Set-Content -NoNewline -Encoding Ascii src-tauri/tauri.windows.ci.conf.json

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --config src-tauri/tauri.windows.ci.conf.json
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}
          releaseName: MusaDVD ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Nightly' }}
          releaseBody: Automated Windows & Linux builds (installer, AppImage, .deb, and portable archives).
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          releaseDraft: false

      - name: Package and upload portable ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}"
          $stage = "portable/MusaDVD"
          New-Item -ItemType Directory -Force -Path "$stage/bin", "$stage/locales", "$stage/menu-audio" | Out-Null
          Copy-Item "target/release/musadvd-gui.exe" "$stage/"
          Copy-Item "target/release/musadvd.exe" "$stage/"
          Copy-Item "bin/*.exe" "$stage/bin/"
          Copy-Item "frontend/src/locales/*.json" "$stage/locales/"
          Copy-Item "assets/menu-audio/*.opus" "$stage/menu-audio/"
          Copy-Item "LICENSE", "THIRD_PARTY_NOTICES.md", "README.md" "$stage/"
          $zip = "MusaDVD-$tag-windows-x64-portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          gh release upload $tag $zip --clobber

  linux:
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux Tauri & AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev libxdo-dev patchelf \
            gstreamer1.0-libav gstreamer1.0-plugins-good gstreamer1.0-plugins-bad

      - run: npm ci

      - name: Build CLI binary
        run: cargo build --release --bin musadvd

      - name: Configure .deb to ship CLI as /usr/bin/musadvd
        run: |
          echo '{"bundle":{"linux":{"deb":{"files":{"/usr/bin/musadvd":"../target/release/musadvd"}}}}}' > src-tauri/tauri.linux.ci.conf.json

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --config src-tauri/tauri.linux.ci.conf.json
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}
          releaseName: MusaDVD ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Nightly' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          releaseDraft: false

      - name: Package and upload portable tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}"
          STAGE="portable/MusaDVD"
          mkdir -p "$STAGE/locales" "$STAGE/menu-audio"
          cp target/release/musadvd-gui target/release/musadvd "$STAGE/"
          cp frontend/src/locales/*.json "$STAGE/locales/"
          cp assets/menu-audio/*.opus "$STAGE/menu-audio/"
          cp LICENSE THIRD_PARTY_NOTICES.md README.md "$STAGE/"
          TAR="MusaDVD-$TAG-linux-x86_64-portable.tar.gz"
          tar -czf "$TAR" -C portable MusaDVD
          gh release upload "$TAG" "$TAR" --clobber
