[workspace]
# The engine + CLI (this package) and the Tauri desktop app, which uses the engine as a library.
members = [".", "src-tauri"]
# `cargo check`/`cargo test` in the root keep building only the engine + CLI by default.
default-members = ["."]
resolver = "2"

[package]
name = "musadvd"
version = "1.3.0"
edition = "2021"
description = "DVD, Blu-ray and AVCHD authoring engine and CLI with Burn Studio"
license = "GPL-3.0-or-later"

[lib]
name = "musadvd"
path = "src/lib.rs"

[[bin]]
name = "musadvd"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_derive = "1"
clap = { version = "4", features = ["derive"] }
image = "0.25"
tokio = { version = "1", features = ["full"] }
regex = "1"
# Text rendering for menu labels (pure Rust, uses the bundled DejaVu font).
ab_glyph = "0.2"
# 8-bit palette PNG output for spumux subpicture masks (same version `image` uses).
png = "0.18"
# ffprobe JSON output.
serde_json = "1"
# Unicode BiDi layout for RTL text (Arabic, Hebrew) subtitles.
unicode-bidi = "0.3"
# Parallel menu rendering.
rayon = "1"
# Enumerates installed OS font families for the menu/subtitle font pickers.
fontdb = "0.23"
# Built-in menu icons (SVG); no text or raster-image features needed.
resvg = { version = "0.45", default-features = false }
# MD5 of images and disc reads (Burn Studio).
md-5 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
# SG_IO ioctl (Burn Studio MMC transport).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# IMAPI2 (disc burning) via COM.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Imapi",
    "Win32_Storage_IscsiDisc",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
windows-core = "0.62"

# Tests render 1080p menu layers and encode small clips; unoptimized builds take minutes for that.
[profile.dev]
opt-level = 2
