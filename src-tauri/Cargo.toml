[package]
name = "musadvd-gui"
version = "0.1.5"
edition = "2021"
description = "Desktop GUI (Tauri) for the MusaDVD authoring engine"
license = "GPL-3.0-or-later"

[[bin]]
name = "musadvd-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
musadvd = { path = ".." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
base64 = "0.22"
