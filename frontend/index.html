<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MusaDVD</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body data-entry="main">
    <div class="app">
      <header class="toolbar">
        <div class="brand"><img class="brand-logo" src="/logo.png" alt="" aria-hidden="true" />MusaDVD<span id="app-version" class="app-version"></span><select id="ui-lang" class="ui-lang" data-i18n-title="settings.uiLanguage" title="Interface language"></select></div>
        <div class="toolbar-actions">
          <button id="btn-home" class="btn" data-i18n="app.home" data-i18n-title="app.homeTip" title="Back to the start page">Home</button>
          <button id="btn-new" class="btn" data-i18n="app.newProject" data-i18n-title="app.newProjectTip" title="Start a new project">New project</button>
          <button id="btn-add" class="btn" data-i18n="app.addVideos">＋ Add videos</button>
          <button id="btn-remove" class="btn" disabled data-i18n="app.remove">Remove</button>
          <button id="btn-up" class="btn icon" data-i18n-title="app.moveUp" title="Move up" disabled>▲</button>
          <button id="btn-down" class="btn icon" data-i18n-title="app.moveDown" title="Move down" disabled>▼</button>
          <button id="btn-open-project" class="btn" data-i18n="app.openProject" data-i18n-title="app.openProjectTip" title="Open project (Ctrl+O)">Open project …</button>
          <button id="btn-save-project" class="btn" data-i18n="app.saveProject" data-i18n-title="app.saveProjectTip" title="Save project (Ctrl+S, Ctrl+Shift+S: save as)">Save project …</button>
          <button id="btn-studio" class="btn" data-i18n="app.studio" data-i18n-title="app.studioTip" title="Burn Studio: burn, read, verify and create images">💿 Burn Studio …</button>
          <button id="btn-settings" class="btn" data-i18n="app.settings" data-i18n-title="app.settingsTip" title="General settings">⚙ Settings</button>
        </div>
      </header>

      <main id="landing" class="landing-host" hidden></main>

      <main class="split" id="workspace">
        <aside class="left">
          <div id="dropzone" class="dropzone">
            <strong data-i18n="app.dropTitle">Drop videos here</strong>
            <span data-i18n="app.dropHint">MKV, MP4, AVI, MOV, TS … – each video becomes its own titleset</span>
          </div>
          <div id="tv-banner" class="tv-banner" hidden></div>
          <ul id="title-list" class="title-list" aria-label="Titlesets"></ul>

          <footer class="left-footer">
            <div class="disc-grid">
              <div class="row">
                <label for="disc" data-i18n="app.medium">Medium</label>
                <select id="disc">
                  <option value="dvd5">DVD-5 (4,3 GB)</option>
                  <option value="dvd9">DVD-9 (8,2 GB)</option>
                  <option value="bd25">BD-25 (22,9 GB)</option>
                  <option value="bd50">BD-50 (45,8 GB)</option>
                  <option value="avchd5">AVCHD (DVD-5, 4,3 GB)</option>
                  <option value="avchd9">AVCHD (DVD-9, 8,2 GB)</option>
                  <option value="custom" id="disc-custom" data-i18n="app.discCustom">Custom</option>
                </select>
              </div>
              <div class="row">
                <label for="tv-standard" data-i18n="settings.tvNorm">TV standard</label>
                <select id="tv-standard">
                  <option value="PAL">PAL</option>
                  <option value="NTSC">NTSC</option>
                </select>
              </div>
              <div class="row" id="dvd-res-row">
                <label for="dvd-resolution" data-i18n="settings.aufloesung">Resolution</label>
                <select id="dvd-resolution" data-i18n-title="app.dvdResHint" title="Half D1 and SIF are 4:3-only per the DVD-Video spec; 16:9 sources are letterboxed automatically.">
                  <option value="Full D1" data-i18n="settings.fullD1720576">Full D1 (720×576)</option>
                  <option value="Half D1" data-i18n="settings.halfD1352576Ntsc">Half D1 (352×576, NTSC 352×480)</option>
                  <option value="SIF" data-i18n="settings.sif352288Ntsc352240">SIF (352×288, NTSC 352×240)</option>
                </select>
              </div>
              <div class="row" id="menu-aspect-row">
                <label for="menu-aspect" data-i18n="app.menuAspect" data-i18n-title="app.menuAspectTip" title="">Menu aspect</label>
                <select id="menu-aspect" data-i18n-title="app.menuAspectTip">
                  <option value="auto" data-i18n="app.menuAspectAuto">Auto</option>
                  <option value="4:3">4:3</option>
                  <option value="16:9">16:9</option>
                </select>
              </div>
              <div class="row" id="dvd-video-row">
                <label for="dvd-video" data-i18n="app.bdVideo" data-i18n-title="settings.dvdVideoNote" title="">Video</label>
                <select id="dvd-video" data-i18n-title="settings.dvdVideoNote">
                  <option value="encode" data-i18n="settings.dvdVideoEncode">Re-encode</option>
                  <option value="auto" data-i18n="settings.dvdVideoAuto">Auto (copy compliant MPEG-2)</option>
                  <option value="strict" data-i18n="settings.dvdVideoStrict">Strict (copy only, error if incompatible)</option>
                </select>
              </div>
              <div class="row" id="bd-video-row" hidden>
                <label for="bd-video" data-i18n="app.bdVideo" data-i18n-title="app.bdVideoTip" title="">Video</label>
                <select id="bd-video" data-i18n-title="app.bdVideoTip">
                  <option value="encode" data-i18n="app.bdVideoEncode">Re-encode</option>
                  <option value="auto" data-i18n="app.bdVideoAuto">Copy when compliant</option>
                  <option value="strict" data-i18n="app.bdVideoStrict">Copy only (strict)</option>
                </select>
              </div>
              <div class="row" id="bd-audio-row" hidden>
                <label for="bd-audio" data-i18n="app.bdAudio" data-i18n-title="app.bdAudioTip" title="">Audio</label>
                <select id="bd-audio" data-i18n-title="app.bdAudioTip">
                  <option value="auto" data-i18n="app.bdAudioAuto">Copy when compliant</option>
                  <option value="encode" data-i18n="app.bdAudioEncode">Re-encode</option>
                  <option value="strict" data-i18n="app.bdAudioStrict">Copy only (strict)</option>
                </select>
              </div>
            </div>
            <div class="fill">
              <div class="fill-bar"><div id="fill-value" class="fill-value"></div></div>
              <div id="fill-text" class="fill-text" data-i18n="app.noVideos">No videos yet</div>
            </div>
            <div class="toggles">
              <label class="switch"><input id="two-pass" type="checkbox" /><span></span><span data-i18n="app.twoPass">2-pass encoding</span></label>
              <label class="switch"><input id="motion-menu" type="checkbox" /><span></span><span data-i18n="app.motionMenu">Motion menu</span></label>
            </div>
            <div class="row output-row">
              <input id="output" type="text" data-i18n-placeholder="app.outputPlaceholder" placeholder="Output folder" spellcheck="false" />
              <button id="btn-output" class="btn icon" data-i18n-title="app.chooseFolder" title="Choose folder">…</button>
            </div>
            <button id="btn-fit" class="btn" hidden data-i18n="app.fitToDisc">Fit to disc</button>
            <button id="btn-split-undo" class="btn" hidden data-i18n="app.splitUndo">Undo split</button>
            <button id="btn-convert" class="btn primary big" disabled data-i18n="app.convert">Convert</button>
          </footer>
        </aside>

        <section class="right">
          <nav class="tabs" role="tablist">
            <button class="tab active" data-tab="audio" role="tab" data-i18n="app.tab.audio">Audio</button>
            <button class="tab" data-tab="subtitles" role="tab" data-i18n="app.tab.subtitles">Subtitles</button>
            <button class="tab" data-tab="chapters" role="tab" data-i18n="app.tab.chapters">Chapters</button>
            <button class="tab" data-tab="edit" role="tab" data-i18n="app.tab.edit">Trim &amp; picture</button>
            <button class="tab" data-tab="video" role="tab" data-i18n="app.tab.video" hidden>Video</button>
            <button class="tab" data-tab="template" role="tab" data-i18n="app.tab.template">Menu template</button>
          </nav>
          <div id="tab-body" class="tab-body"></div>
        </section>
      </main>

      <div id="status-bar" class="status-bar"></div>
    </div>

    <div id="overlay" class="overlay" hidden>
      <div class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
        <h2 id="overlay-title" data-i18n="app.overlay.title">Conversion in progress</h2>
        <ol id="phases" class="phases">
          <li data-phase="menus" data-i18n="app.phase.menus">Menus</li>
          <li data-phase="encoding" data-i18n="app.phase.encoding">Videos</li>
          <li data-phase="authoring" data-i18n="app.phase.authoring">Authoring</li>
          <li data-phase="image" data-i18n-title="app.phase.inBurnDialog" title="in the burn dialog">ISO</li>
          <li data-phase="burning" data-i18n-title="app.phase.inBurnDialog" title="in the burn dialog" data-i18n="app.phase.burning">Burn</li>
        </ol>
        <div class="progress-block">
          <div class="progress-label"><span data-i18n="app.overlay.total">Total</span><span id="total-pct">0 %</span></div>
          <div class="progress"><div id="total-bar" class="progress-value"></div></div>
        </div>
        <div id="eta-line" class="eta-line" aria-live="polite"></div>
        <div class="progress-block">
          <div class="progress-label"><span id="step-label" data-i18n="app.overlay.starting">Starting …</span><span id="step-pct"></span></div>
          <div class="progress thin"><div id="step-bar" class="progress-value"></div></div>
        </div>
        <ul id="log" class="log"></ul>
        <div class="overlay-actions">
          <button id="btn-cancel" class="btn danger" data-i18n="app.overlay.cancel">Cancel</button>
          <button id="btn-burn" class="btn" hidden data-i18n="app.overlay.burn">Burn to disc …</button>
          <button id="btn-close-overlay" class="btn primary" hidden data-i18n="app.overlay.close">Close</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
